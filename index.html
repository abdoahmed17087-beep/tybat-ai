<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الطيبات AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #256d3b;
            --accent-green: #4caf50;
            --desert-sand: #fdf6e3;
            --text-dark: #1a1a1a;
            --white: #ffffff;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body {
            background-color: var(--desert-sand);
            font-family: 'Cairo', sans-serif;
            color: var(--text-dark);
            line-height: 1.6;
            padding: 10px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .main-wrapper {
            display: flex;
            flex-direction: column; /* الموبايل أولاً: عناصر تحت بعضها */
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            background: var(--white);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* للشاشات الكبيرة (الكمبيوتر) نرجعه لشكل جانبي */
        @media (min-width: 769px) {
            .main-wrapper { flex-direction: row; align-items: stretch; }
            body { padding: 40px 20px; align-items: center; }
        }

        .sidebar {
            background: var(--primary-green);
            color: var(--white);
            padding: 30px 20px;
            text-align: center;
            flex: 1;
        }

        .avatar-container {
            width: 100px; height: 100px;
            margin: 0 auto 15px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.3);
            overflow: hidden;
        }

        .avatar { width: 100%; height: 100%; object-fit: cover; }

        .main-content { 
            flex: 2; 
            padding: 20px;
        }

        @media (min-width: 769px) {
            .main-content { padding: 40px; }
        }

        .card {
            background: #f9f9f9;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border-right: 5px solid var(--accent-green);
        }

        h1 { font-size: 1.5rem; margin-bottom: 5px; }
        h2 { font-size: 1.2rem; margin-bottom: 15px; color: var(--primary-green); }

        .btn {
            width: 100%;
            padding: 15px;
            background: var(--accent-green);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
        }

        .btn:hover { background: var(--primary-green); }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: 'Cairo';
            font-size: 1rem;
        }

        .result-box {
            margin-top: 15px;
            padding: 15px;
            background: #fff;
            border: 1px solid #eee;
            border-radius: 8px;
            word-wrap: break-word;
            display: none;
            text-align: right;
        }

        /* إصلاح الأنيميشن والتحميل */
        .loading-container {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            font-weight: bold;
            color: var(--primary-green);
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--accent-green);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <header class="sidebar">
            <div class="avatar-container">
                <img src="NzAweDQwMC5qcGc (1).png" alt="د. ضياء العوضي" class="avatar">
            </div>
            <h1>الطيبات AI</h1>
            <p>المساعد الذكي لمنهج د. ضياء العوضي</p>
        </header>

        <main class="main-content">
            <section class="card">
                <h2>🧠 اسأل عن صنف</h2>
                <input type="text" id="userInput" placeholder="مثال: هل العسل مسموح؟">
                <button class="btn" onclick="askSpecificItem(document.getElementById('userInput').value)">استشر المنهج</button>
                
                <div id="loading" class="loading-container"><div class="spinner"></div> جاري البحث...</div>
                <div id="resultBox" class="result-box"></div>
            </section>

            <section class="card">
                <h2>📅 جدول اليوم</h2>
                <button class="btn" onclick="fetchRecommendations()">اقترح لي وجبات كاملة</button>
                
                <div id="suggestLoading" class="loading-container"><div class="spinner"></div> جاري التحضير...</div>
                <div id="suggestResult" class="result-box"></div>
            </section>
        </main>
    </div>

    <script>
                  const systemPrompt = `

أنت المساعد الرسمي لمنهج "نظام الطيبات" للدكتور ضياء العوضي.

التزم بالقواعد التالية بدقة عند الرد ولا تخرج عنها أبداً:



المعلومات الأساسية:

- الماء عند الحاجة.



1. المسموحات (يُسمح بتكرارها يومياً):

- النشويات: الأرز (بكل أنواعه)، البطاطس.

- البروتينات: اللحوم (خروف، بقري، جملي)، الحمام، الكبدة.

- الأسماك: مرة واحدة في الشهر فقط.

- الفواكه: التمور، العنب، الجوافة (بدون بذر)، الرمان (بدون بذر)، التين، الموز، الفراولة، المشمش، البخارة (برقوق).

- إضافات: زيتون، زبدة، مربى، نوتيلا، عسل، توست النخالة، جبن (شيدر، جودة، فلمنك).

- المشروبات: الشاي الأخضر فقط.



2. الممنوعات (يُمنع منعاً باتاً):

- الدقيق ومشتقاته (خبز أبيض، فينو)، المكرونة.

- المشروبات الغازية، الشاي الأحمر.

- الحليب ومشتقاته (قريش، أجبان طازجة، رايب).

- ممنوع استخدام الدجاج بجميع أنواعه وأشكاله وكل شيء متعلق للفراخ منعاً باتاً.

- البيض، الجمبري، الحبار.

- البقوليات (فول، بسلة، لوبيا، فول سوداني).

- الورقيات، الخضروات، البطيخ، الشمام.



تعليمات تنسيق الإجابة (إجبارية):

- يجب عليك تقسيم الإجابة وتنظيمها بدقة بحيث تعرض الوجبات على الشكل التالي:

<strong>🍽️ وجبة الإفطار:</strong>

[اكتب هنا ما يُسمح بتناوله في وجبة الإفطار بناءً على القواعد أعلاه]



<strong>🍽️ وجبة الغداء:</strong>

[اكتب هنا ما يُسمح بتناوله في وجبة الغداء بناءً على القواعد أعلاه]



<strong>🍽️ وجبة العشاء:</strong>

[اكتب هنا ما يُسمح بتناوله في وجبة العشاء بناءً على القواعد أعلاه]



قواعد التشغيل:

- الأكل عند الجوع فقط.

- عند تقديم أي نصيحة، وضح السبب العلمي (كيميائي/حيوي) حسب منهج الدكتور ضياء العوضي.

- شجع المستخدم على التدرج في تغيير العادات.

- إذا سُئلت عن شيء غير موجود في القوائم أعلاه، اعتذر بوضوح لعدم توفر المعلومة في منهج النظام.

- اختم نهاية الإجابة دائماً بجملة: "هذه المعلومات قائمة على منهج نظام الطيبات للدكتور ضياء العوضي، ولا تغني عن التشخيص الطبي المتخصص".

`;


        async function askGroq(promptText, resultId, loadId) {
            const resultDiv = document.getElementById(resultId);
            const loadDiv = document.getElementById(loadId);

            resultDiv.style.display = "none";
            loadDiv.style.display = "flex";

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'llama-3.1-8b-instant',
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: promptText }
                        ],
                        temperature: 0.3
                    })
                });

                const data = await response.json();
                if (data.choices && data.choices[0]) {
                    resultDiv.innerHTML = data.choices[0].message.content.replace(/\n/g, '<br>');
                } else {
                    resultDiv.innerHTML = "حدث خطأ في الرد.";
                }
            } catch (error) {
                resultDiv.innerHTML = "خطأ في الاتصال بالسيرفر.";
            } finally {
                loadDiv.style.display = "none";
                resultDiv.style.display = "block";
            }
        }

        function askSpecificItem(item) {
            if(!item.trim()) return alert("اكتب شيئاً أولاً");
            askGroq(`هل الصنف "${item}" مسموح؟ اشرح المنطقة والسبب.`, "resultBox", "loading");
        }

        function fetchRecommendations() {
            askGroq("اقترح جدول وجبات ليوم كامل مسموح في الطيبات.", "suggestResult", "suggestLoading");
        }
    </script>
</body>
</html>
