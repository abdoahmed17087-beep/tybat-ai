<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الطيبات AI</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-green: #256d3b;
            --accent-green: #4caf50;
            --desert-sand: #fdf6e3;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-dark: #1a1a1a;
            --text-muted: #555555;
            --white: #ffffff;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--desert-sand);
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23e6dfcc' fill-opacity='0.4'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            font-family: 'Cairo', sans-serif;
            color: var(--text-dark);
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .main-wrapper {
            display: flex;
            max-width: 1200px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.18);
            overflow: hidden;
        }

        @media (max-width: 768px) { .main-wrapper { flex-direction: column; } }

        .sidebar {
            flex: 1;
            background: linear-gradient(160deg, var(--primary-green) 0%, #1a4d2e 100%);
            color: var(--white);
            padding: 60px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .avatar-container {
            width: 150px; height: 150px;
            border-radius: 50%;
            border: 6px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .avatar { width: 100%; height: 100%; object-fit: cover; }

        .main-content { flex: 2; padding: 60px; }

        .card {
            background: var(--white);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid #eeeeee;
        }

        .btn {
            padding: 18px 30px;
            background: var(--accent-green);
            color: var(--white);
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: var(--transition);
        }

        .btn:hover { background: var(--primary-green); transform: translateY(-2px); }

        input[type="text"] {
            width: 100%; padding: 18px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            margin-bottom: 20px;
            font-family: 'Cairo';
        }

        .result-box {
            background: #f9f9f9;
            padding: 25px;
            border-radius: 12px;
            border-right: 6px solid var(--accent-green);
            margin-top: 20px;
            display: none;
        }

        .loading-container {
            display: none;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .spinner {
            width: 20px; height: 20px;
            border: 3px solid #eee;
            border-top-color: var(--accent-green);
            border-radius: 50%;
            animation: spin 1s infinite linear;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <header class="sidebar">
            <div class="avatar-container">
                <!-- تأكد من وجود ملف الصورة في المستودع بنفس الاسم -->
                <img src="NzAweDQwMC5qcGc (1).png" alt="صورة الدكتور ضياء العوضي" class="avatar">
            </div>
            <h1>الطيبات AI</h1>
            <p>المساعد الذكي لمنهج الدكتور ضياء العوضي</p>
        </header>

        <main class="main-content">
            <section class="card">
                <h2>🧠 اسأل عن صنف</h2>
                <input type="text" id="userInput" placeholder="مثال: هل العسل مسموح؟">
                <button class="btn" onclick="askSpecificItem(document.getElementById('userInput').value)">استشر المنهج</button>
                
                <div id="loading" class="loading-container"><div class="spinner"></div> جاري البحث...</div>
                <div id="resultBox" class="result-box"></div>
            </section>

            <section class="card">
                <h2>📅 جدول اليوم</h2>
                <button class="btn" onclick="fetchRecommendations()">اقترح لي وجبات كاملة</button>
                
                <div id="suggestLoading" class="loading-container"><div class="spinner"></div> جاري التحضير...</div>
                <div id="suggestResult" class="result-box"></div>
            </section>
        </main>
    </div>

    <script>
       const systemPrompt = `أنت المساعد الرسمي لنظام الطيبات للدكتور ضياء العوضي، وتعتمد في إجاباتك على تصنيف المناطق اللونية:

المسموحات (المناطق الخضراء والصفراء والبرتقالية):
- المنطقة الخضراء (أمان مطلق): الأرز، البطاطس، زيت الزيتون، الملح، الخل، التمر، العسل، عصير القصب الطبيعي.
- المنطقة الصفراء (يومياً مع مراقبة): القهوة (غير المحوجة)، شاي إيرل جراي، الشاي الأخضر، الأجبان الصفراء (شيدر، فلمنك، جودا)، الزبدة والسمن الطبيعي، المربى المنزلي.
- المنطقة البرتقالية (1-3 مرات أسبوعياً): اللحوم الحمراء (بقري/ضاني/جملي) مسلوقة جيداً، الكبدة الضاني، الحمام، السمان، الأسماك البحرية (مشوية بدون ثوم)، المكسرات، الفواكه (عنب، تين، موز، فراولة - بدون بذر أو ألياف).

الممنوعات (المنطقة الحمراء - ممنوعة نهائياً):
- الدقيق الأبيض ومشتقاته (خبز، مكرونة تقليدية، كيك)، الدواجن (دجاج، بط، رومي)، البيض.
- الألبان السائلة (لبن بقري/جاموسي)، الأجبان البيضاء، الثوم، البصل، الطماطم، الفلفل، الباذنجان.
- البقوليات (فول، عدس، فاصوليا)، الورقيات الخضراء (خس، جرجير، ملوخية)، الحمضيات (ليمون، برتقال).
- المشروبات الغازية، السكر الأبيض (يُفضل استبداله)، الزيوت المهدرجة.

طريقة الإجابة:
1. قسم الوجبات دائماً إلى (إفطار، غداء، عشاء) بناءً على المسموحات أعلاه.
2. اذكر السبب العلمي باختصار (يركز النظام على تقليل المدخلات المرهقة للجهاز الهضمي ومنع المواد المسببة للالتهابات والمواد الكبريتية الموجودة في الممنوعات).
3. نبه المستخدم دائماً لمراقبة أعراضه (هضمية، حركية، جلدية) عند تناول أطعمة المنطقة الصفراء والبرتقالية.`;

        async function askGroq(promptText, resultId, loadId) {
            const resultDiv = document.getElementById(resultId);
            const loadDiv = document.getElementById(loadId);

            resultDiv.style.display = "none";
            loadDiv.style.display = "flex";

            try {
                // نكلم السيرفر الخاص بنا في Vercel وليس Groq مباشرة
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'llama-3.1-8b-instant',
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: promptText }
                        ],
                        temperature: 0.3
                    })
                });

                const data = await response.json();
                
                if (data.choices && data.choices[0]) {
                    resultDiv.innerHTML = data.choices[0].message.content.replace(/\n/g, '<br>');
                } else {
                    resultDiv.innerHTML = "حدث خطأ في الرد من السيرفر.";
                }
            } catch (error) {
                resultDiv.innerHTML = "خطأ في الاتصال. تأكد من إعدادات Vercel والـ API Key.";
                console.error(error);
            } finally {
                loadDiv.style.display = "none";
                resultDiv.style.display = "block";
            }
        }

        function askSpecificItem(item) {
            if(!item) return alert("اكتب شيئاً أولاً");
            askGroq(`هل الصنف "${item}" مسموح؟ اشرح السبب علمياً.`, "resultBox", "loading");
        }

        function fetchRecommendations() {
            askGroq("اقترح جدول وجبات ليوم كامل مسموح في الطيبات.", "suggestResult", "suggestLoading");
        }

        window.onload = () => { console.log("Site Ready"); };
    </script>
</body>
</html>
