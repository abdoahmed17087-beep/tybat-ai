<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الطيبات AI</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
        --primary-green: #256d3b;
        --accent-green: #4caf50;
        --desert-sand: #fdf6e3;
        --text-dark: #1a1a1a;
        --white: #ffffff;
    }

    * { 
        box-sizing: border-box; 
        margin: 0; 
        padding: 0; 
    }

    body {
        background-color: var(--desert-sand);
        font-family: 'Cairo', sans-serif;
        color: var(--text-dark);
        line-height: 1.6;
        padding: 10px; /* تقليل الحواف الخارجية في الموبايل */
    }

    .main-wrapper {
        display: flex;
        flex-direction: column; /* جعل العناصر تحت بعضها بشكل افتراضي للموبايل */
        max-width: 1100px;
        width: 100%;
        margin: 0 auto;
        background: var(--white);
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    /* للشاشات الكبيرة (الكمبيوتر) نرجعه لشكل جانبي */
    @media (min-width: 769px) {
        .main-wrapper { flex-direction: row; }
        body { padding: 20px; }
    }

    .sidebar {
        background: var(--primary-green);
        color: var(--white);
        padding: 30px 20px;
        text-align: center;
        flex: 1;
    }

    .avatar-container {
        width: 100px; height: 100px;
        margin: 0 auto 15px;
        border-radius: 50%;
        border: 3px solid rgba(255,255,255,0.3);
        overflow: hidden;
    }

    .avatar { width: 100%; height: 100%; object-fit: cover; }

    .main-content { 
        flex: 2; 
        padding: 20px; /* تقليل الحشو الداخلي للموبايل */
    }

    /* للشاشات الكبيرة نزيد الحشو */
    @media (min-width: 769px) {
        .main-content { padding: 40px; }
    }

    .card {
        background: #f9f9f9;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 20px;
        border-right: 5px solid var(--accent-green);
    }

    .btn {
        width: 100%;
        padding: 15px;
        background: var(--accent-green);
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        font-size: 1rem;
    }

    input[type="text"] {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-family: 'Cairo';
    }

    .result-box {
        margin-top: 15px;
        padding: 15px;
        background: #fff;
        border: 1px solid #eee;
        border-radius: 8px;
        word-wrap: break-word; /* لمنع خروج النص عن الشاشة */
        display: none;
    }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <header class="sidebar">
            <div class="avatar-container">
                <!-- تأكد من وجود ملف الصورة في المستودع بنفس الاسم -->
                <img src="NzAweDQwMC5qcGc (1).png" alt="صورة الدكتور ضياء العوضي" class="avatar">
            </div>
            <h1>الطيبات AI</h1>
            <p>المساعد الذكي لمنهج الدكتور ضياء العوضي</p>
        </header>

        <main class="main-content">
            <section class="card">
                <h2>🧠 اسأل عن صنف</h2>
                <input type="text" id="userInput" placeholder="مثال: هل العسل مسموح؟">
                <button class="btn" onclick="askSpecificItem(document.getElementById('userInput').value)">استشر المنهج</button>
                
                <div id="loading" class="loading-container"><div class="spinner"></div> جاري البحث...</div>
                <div id="resultBox" class="result-box"></div>
            </section>

            <section class="card">
                <h2>📅 جدول اليوم</h2>
                <button class="btn" onclick="fetchRecommendations()">اقترح لي وجبات كاملة</button>
                
                <div id="suggestLoading" class="loading-container"><div class="spinner"></div> جاري التحضير...</div>
                <div id="suggestResult" class="result-box"></div>
            </section>
        </main>
    </div>

    <script>
       const systemPrompt = `أنت المساعد الرسمي لنظام الطيبات للدكتور ضياء العوضي، وتعتمد في إجاباتك على تصنيف المناطق اللونية:

        1. المسموحات (المناطق الخضراء والصفراء والبرتقالية):
        - الخضراء (أمان مطلق): الأرز، البطاطس، زيت الزيتون، الملح، الخل، التمر، العسل، عصير القصب الطبيعي.
        - الصفراء (يومياً مع مراقبة): القهوة (غير المحوجة)، شاي إيرل جراي، الشاي الأخضر، الأجبان الصفراء (شيدر، فلمنك، جودا)، الزبدة والسمن الطبيعي، المربى المنزلي.
        - البرتقالية (1-3 مرات أسبوعياً): اللحوم الحمراء (بقري/ضاني/جملي) مسلوقة جيداً جداً، الكبدة الضاني، الحمام، السمان، الأسماك البحرية (مشوية بدون ثوم)، المكسرات، الفواكه (عنب، تين، موز، فراولة - بدون بذور).

        2. الممنوعات (المنطقة الحمراء - تجنب تام):
        - الدقيق الأبيض (خبز، مكرونة، كيك)، الدواجن (دجاج، بط، رومي)، البيض.
        - الألبان السائلة (بقري/جاموسي)، الأجبان البيضاء، الثوم، البصل، الطماطم، الفلفل، الباذنجان.
        - البقوليات (فول، عدس، الخ)، الورقيات الخضراء، الحمضيات (ليمون، برتقال)، المشروبات الغازية، الزيوت المهدرجة.

        قواعد الرد:
        - ابدأ دائماً بتصنيف الصنف (مسموح/ممنوع) وضمن أي منطقة لونية.
        - عند طلب وجبات، قسمها (إفطار، غداء، عشاء) واذكر السبب العلمي (تقليل الجهد الهضمي وتجنب المواد الكبريتية والالتهابية).
        - أضف تنبيه لمراقبة الأعراض (الهضمية أو الجلدية) عند تناول أصناف المنطقة الصفراء/البرتقالية.`;

        async function askGroq(promptText, resultId, loadId) {
            const resultDiv = document.getElementById(resultId);
            const loadDiv = document.getElementById(loadId);

            resultDiv.style.display = "none";
            loadDiv.style.display = "flex";

            try {
                // نكلم السيرفر الخاص بنا في Vercel وليس Groq مباشرة
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'llama-3.1-8b-instant',
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: promptText }
                        ],
                        temperature: 0.3
                    })
                });

                const data = await response.json();
                
                if (data.choices && data.choices[0]) {
                    resultDiv.innerHTML = data.choices[0].message.content.replace(/\n/g, '<br>');
                } else {
                    resultDiv.innerHTML = "حدث خطأ في الرد من السيرفر.";
                }
            } catch (error) {
                resultDiv.innerHTML = "خطأ في الاتصال. تأكد من إعدادات Vercel والـ API Key.";
                console.error(error);
            } finally {
                loadDiv.style.display = "none";
                resultDiv.style.display = "block";
            }
        }

        function askSpecificItem(item) {
            if(!item) return alert("اكتب شيئاً أولاً");
            askGroq(`هل الصنف "${item}" مسموح؟ اشرح السبب علمياً.`, "resultBox", "loading");
        }

        function fetchRecommendations() {
            askGroq("اقترح جدول وجبات ليوم كامل مسموح في الطيبات.", "suggestResult", "suggestLoading");
        }

        window.onload = () => { console.log("Site Ready"); };
    </script>
</body>
</html>
